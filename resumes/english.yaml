design:
    theme: moderncv
locale:
    language: english
settings:
    current_date: today
    pdf_title: Willian Pinheiro - Resume
    render_command:
        output_folder: ../rendercv_output
        typst_path: OUTPUT_FOLDER/willian-pinheiro-resume-english.typ
        pdf_path: OUTPUT_FOLDER/willian-pinheiro-resume-english.pdf
        dont_generate_markdown: true
        dont_generate_html: true
        dont_generate_png: true
