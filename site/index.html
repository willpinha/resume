<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>Willian Pinheiro resumes</title>
		<style>
			:root {
				--bg: #ffffff;
				--fg: #1a1a1a;
				--muted: #6b6b6b;
				--button-bg: #1a1a1a;
				--button-fg: #ffffff;
				--button-hover: #333333;
			}

			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #121212;
					--fg: #f0f0f0;
					--muted: #9a9a9a;
					--button-bg: #f0f0f0;
					--button-fg: #121212;
					--button-hover: #d0d0d0;
				}
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 2rem;
				background: var(--bg);
				color: var(--fg);
				font-family:
					system-ui,
					-apple-system,
					"Segoe UI",
					Roboto,
					sans-serif;
				line-height: 1.5;
			}

			main {
				text-align: center;
				max-width: 32rem;
			}

			h1 {
				font-size: clamp(1.75rem, 5vw, 2.5rem);
				font-weight: 600;
				margin-bottom: 0.5rem;
			}

			p {
				color: var(--muted);
				margin-bottom: 2rem;
			}

			nav {
				display: flex;
				flex-wrap: wrap;
				justify-content: center;
				gap: 1rem;
			}

			a {
				display: inline-block;
				min-width: 10rem;
				padding: 0.75rem 1.5rem;
				border-radius: 0.5rem;
				background: var(--button-bg);
				color: var(--button-fg);
				font-size: 1rem;
				font-weight: 500;
				text-decoration: none;
				transition: background 0.15s ease;
			}

			a:hover,
			a:focus-visible {
				background: var(--button-hover);
			}

			a:focus-visible {
				outline: 2px solid var(--fg);
				outline-offset: 2px;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Willian Pinheiro</h1>
			<p>Choose a language to open the resume</p>
			<nav>
				<a
					href="willian-pinheiro-resume-english.pdf"
					target="_blank"
					rel="noopener"
				>
					🇺🇸 English
				</a>
				<a
					href="willian-pinheiro-resume-portuguese.pdf"
					target="_blank"
					rel="noopener"
				>
					🇧🇷 Portuguese
				</a>
			</nav>
		</main>
	</body>
</html>
