name: Deploy

on:
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v7

            - uses: astral-sh/setup-uv@v10
              with:
                  enable-cache: true

            - name: Install dependencies
              run: uv sync --locked

            - name: Render resumes
              run: |
                  for resume in resumes/*.yaml; do
                    uv run rendercv render "$resume"
                  done
                  cp rendercv_output/*.pdf site/

            - uses: actions/configure-pages@v6

            - uses: actions/upload-pages-artifact@v5
              with:
                  path: site

            - id: deployment
              uses: actions/deploy-pages@v5
