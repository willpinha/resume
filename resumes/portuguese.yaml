# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.8/schema.json
cv:
    name: Willian Pinheiro
    headline: Engenheiro de Software Pleno
    location: São Paulo, Brasil
    email: willpinhaaa@gmail.com
    website: https://willpinha.github.io
    social_networks:
        - network: LinkedIn
          username: willpinha
        - network: GitHub
          username: willpinha
    sections:
        sobre:
            - >
                Desenvolvedor de software backend com 3 anos de experiência, atualmente focado em sistemas de alta escalabilidade. Gosta de entender os processos de negócio por trás dos sistemas que constrói, não apenas a tecnologia, buscando propor soluções junto das equipes que melhorem a operação da empresa como um todo.
        formação:
            - institution: Universidade de São Paulo (USP)
              area: Sistemas de Informação
              degree: Bacharel
              start_date: 2020-03
              end_date: 2025-05
        experiência:
            - company: Mercado Livre
              position: Desenvolvedor de Software
              start_date: 2025-02
              end_date: present
              highlights:
                  - Manutenção e evolução do Warehouse Management System, atuando na otimização de rotas de picking em mais de 100 centros de distribuição
                  - Sistemas que sustentam milhões de requisições diárias, mantendo alta disponibilidade em ambiente de operação crítica
                  - Propus e implementei ferramentas de observabilidade para identificar inconsistências de dados entre bancos sincronizados e monitorar demoras em fluxos críticos de processamento
            - company: Círculo Militar de São Paulo
              position: Analista de Sistemas
              start_date: 2024-02
              end_date: 2025-02
              highlights:
                  - Colaborei no desenvolvimento do sistema de agendamento de espaços do clube (quadras, salão de beleza, academias) em C# e SQL Server, para uso interno e externo
                  - Integração com sistema terceirizado de controle de acesso via catracas para monitoramento de entrada de associados e funcionários
                  - Desenvolvi sozinho o sistema de gestão de encomendas, com registro na portaria e retirada posterior por associados e funcionários
        projetos:
            - name: "[willpinha.github.io](https://willpinha.github.io)"
              summary: >
                  Site pessoal em Go que consome a API GraphQL do GitHub para exibir contribuições open source
              highlights:
                  - Geração de site estático a partir de dados da API GraphQL do GitHub
                  - Testes automatizados e pipeline de CI/CD para build e deploy
        habilidades:
            - label: Linguagens
              details: Go, Java, C#, PHP, Python, TypeScript, SQL
            - label: Bancos de Dados
              details: MySQL, SQL Server, PostgreSQL
            - label: Infraestrutura
              details: Docker, Kubernetes, Fury (IDP do Mercado Livre), mensageria (queue/pub-sub), object storage
            - label: Observabilidade
              details: Grafana, Datadog, ClickHouse
            - label: Idiomas
              details: Português (nativo), Inglês (intermediário)
design:
    theme: moderncv
    templates:
        footer: ""
        top_note: ""
locale:
    language: portuguese
settings:
    current_date: today
    pdf_title: Willian Pinheiro
    render_command:
        output_folder: ../rendercv_output
        typst_path: OUTPUT_FOLDER/willian-pinheiro-resume-portuguese.typ
        pdf_path: OUTPUT_FOLDER/willian-pinheiro-resume-portuguese.pdf
        dont_generate_markdown: true
        dont_generate_html: true
        dont_generate_png: true
